name: LeQutis PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LEQUTIS_WORKER: deterministic
      LEQUTIS_HERMES_QUERY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests with one bounded retry
        id: tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          code=$?
          attempts=1
          if [ "$code" -ne 0 ]; then
            echo "first test attempt failed; retrying once"
            python3 -m unittest discover -s tests -p 'test_*.py' -q
            code=$?
            attempts=2
          fi
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # Keep going so receipts are always written; final step fails the job.
          exit 0

      - name: Wait for required disposable evidence check
        id: checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          passed=false
          for _ in $(seq 1 36); do
            row=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | awk '$1=="verify" {print; exit}')
            state=$(printf '%s' "$row" | awk '{print $2}')
            echo "verify_state=${state:-pending}"
            case "$state" in
              pass|success) passed=true; break ;;
              fail|failure|failing|cancelled) passed=false; break ;;
            esac
            sleep 10
          done
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Wait briefly for independent Codex review
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=missing
          for _ in 1 2 3 4; do
            status=$(python3 - <<'PY'
          import json, os, re, subprocess, sys

          def gh_json(args):
              proc = subprocess.run(
                  ["gh", "api", *args],
                  check=False,
                  text=True,
                  capture_output=True,
              )
              if proc.returncode != 0 or not proc.stdout.strip():
                  return None
              return json.loads(proc.stdout)

          repo = os.environ["REPO"]
          pr = os.environ["PR"]
          head = os.environ["HEAD_SHA"]

          def matches_head(sha: str | None) -> bool:
              if not sha:
                  return False
              return head.startswith(sha) or sha.startswith(head[:7])

          comments = gh_json([f"repos/{repo}/issues/{pr}/comments"]) or []
          state = None
          for comment in reversed(comments):
              if (comment.get("user") or {}).get("login") != "chatgpt-codex-connector[bot]":
                  continue
              body = comment.get("body") or ""
              match = re.search(r"codex-review-state:v1\s+(\{.*?\})\s*-->", body, re.S)
              if not match:
                  continue
              try:
                  state = json.loads(match.group(1))
              except json.JSONDecodeError:
                  continue
              break
          if state:
              cr = state.get("code_review") or {}
              if matches_head(cr.get("commit_sha")):
                  if cr.get("has_any_findings") or cr.get("has_unresolved_findings"):
                      print("findings")
                  else:
                      print("pass")
                  raise SystemExit(0)

          review_comments = gh_json([f"repos/{repo}/pulls/{pr}/comments"]) or []
          for item in review_comments:
              if (item.get("user") or {}).get("login") != "chatgpt-codex-connector[bot]":
                  continue
              if "codex-code-review-finding" not in (item.get("body") or ""):
                  continue
              if matches_head(item.get("commit_id")):
                  print("findings")
                  raise SystemExit(0)

          reviews = gh_json([f"repos/{repo}/pulls/{pr}/reviews"]) or []
          for item in reviews:
              if (item.get("user") or {}).get("login") != "chatgpt-codex-connector[bot]":
                  continue
              if matches_head(item.get("commit_id")):
                  print("pass")
                  raise SystemExit(0)

          print("missing")
          PY
          )
            if [ "$status" != "missing" ]; then
              break
            fi
            sleep 15
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Decide with independent auditor + engineering receipt
        id: decide
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          mkdir -p evidence
          python3 integrations/pr_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --head-sha "$HEAD_SHA" \
            --body-file /tmp/pr-body.md \
            --tests-passed "${{ steps.tests.outputs.passed }}" \
            --codex-status "${{ steps.review.outputs.status }}" \
            --test-attempts "${{ steps.tests.outputs.attempts }}" \
            --required-checks-passed "${{ steps.checks.outputs.passed }}" \
            --pr-number "$PR" \
            --run-url "$RUN_URL" \
            --out evidence/pr-gate-receipt.json \
            --auditor-out evidence/pr-auditor-receipt.json \
            --receipt-out evidence/engineering-workflow-receipt.json
          merge=$(python3 -c 'import json; print("true" if json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))["merge_allowed"] else "false")')
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-gate-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/pr-gate-receipt.json
            evidence/pr-auditor-receipt.json
            evidence/engineering-workflow-receipt.json
          if-no-files-found: warn

      - name: Fail the gate when tests or required checks failed
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.tests.outputs.passed }}" != "true" ]; then
            echo "Unit tests failed after bounded retry."
            exit 1
          fi
          if [ ! -f evidence/pr-gate-receipt.json ]; then
            echo "Missing gate receipt."
            exit 1
          fi
          python3 - <<'PY'
          import json, sys
          verdict = json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))
          # Infrastructure/docs policy refusals still produce a successful gate *job*
          # when tests passed; only hard execution failures fail the check.
          hard = {"tests_failed", "required_checks_failed"}
          blocking = set(verdict.get("blocking") or [])
          if blocking & hard:
              print("Hard gate failure:", sorted(blocking & hard))
              sys.exit(1)
          print("Gate job conclusion ok; merge_allowed=", verdict.get("merge_allowed"))
          PY
