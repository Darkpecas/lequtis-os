name: LeQutis PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LEQUTIS_WORKER: deterministic
      LEQUTIS_HERMES_QUERY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests with one bounded retry
        id: tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          code=$?
          attempts=1
          if [ "$code" -ne 0 ]; then
            echo "first test attempt failed; retrying once"
            python3 -m unittest discover -s tests -p 'test_*.py' -q
            code=$?
            attempts=2
          fi
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Wait for required disposable evidence check
        id: checks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          passed=false
          for _ in $(seq 1 36); do
            row=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | awk '/\tverify\t|\sverify\s/ {print; exit}')
            # Fallback: any line whose first field is exactly verify
            if [ -z "$row" ]; then
              row=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | awk '$1=="verify" {print; exit}')
            fi
            state=$(printf '%s' "$row" | awk '{print $2}')
            echo "verify_state=${state:-pending}"
            case "$state" in
              pass|success|skipping) passed=true; break ;;
              fail|failure|failing|cancelled) passed=false; break ;;
            esac
            sleep 10
          done
          # Docs-only PRs may not trigger path-filtered sovereign-loop; disposable-evidence still runs.
          if [ "$passed" != "true" ]; then
            # Soft fallback: if our own unit tests passed and no verify row failed, accept pending-absent after wait.
            any_fail=$(gh pr checks "$PR" --repo "$REPO" 2>/dev/null | awk '$2 ~ /fail/ {print; exit}')
            if [ -z "$any_fail" ] && [ "${{ steps.tests.outputs.passed }}" = "true" ]; then
              echo "No failing required checks after wait; treating disposable suite as satisfied for gate."
              passed=true
            fi
          fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

      - name: Wait briefly for independent Codex review
        id: review
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          status=missing
          for _ in 1 2 3 4; do
            comments=$(gh api "repos/${REPO}/pulls/${PR}/comments" --jq '[.[] | select(.user.login=="chatgpt-codex-connector[bot]") | .body] | join("\n")')
            reviews=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --jq '[.[] | select(.user.login=="chatgpt-codex-connector[bot]")] | length')
            issue_comments=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '[.[] | select(.user.login=="chatgpt-codex-connector[bot]") | .body] | join("\n")')
            combined=$(printf '%s\n%s' "$comments" "$issue_comments")
            if printf '%s' "$combined" | grep -q 'codex-code-review-finding'; then
              status=findings
              break
            fi
            if printf '%s' "$combined" | grep -q '"has_any_findings":true\|"has_unresolved_findings":true'; then
              status=findings
              break
            fi
            if [ "$reviews" != "0" ]; then
              status=pass
              break
            fi
            if printf '%s' "$combined" | grep -q 'codex-review-state'; then
              if printf '%s' "$combined" | grep -q '"has_any_findings":false'; then
                status=pass
                break
              fi
            fi
            sleep 15
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Decide with independent auditor + engineering receipt
        id: decide
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          mkdir -p evidence
          python3 integrations/pr_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --body-file /tmp/pr-body.md \
            --tests-passed "${{ steps.tests.outputs.passed }}" \
            --codex-status "${{ steps.review.outputs.status }}" \
            --test-attempts "${{ steps.tests.outputs.attempts }}" \
            --required-checks-passed "${{ steps.checks.outputs.passed }}" \
            --pr-number "$PR" \
            --run-url "$RUN_URL" \
            --out evidence/pr-gate-receipt.json \
            --auditor-out evidence/pr-auditor-receipt.json \
            --receipt-out evidence/engineering-workflow-receipt.json
          merge=$(python3 -c 'import json; print("true" if json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))["merge_allowed"] else "false")')
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post the receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ ! -f evidence/pr-gate-receipt.json ]; then
            echo "No receipt to post."
            exit 0
          fi
          python3 - <<'PY' > /tmp/pr-gate-comment.md
          import json
          from pathlib import Path
          verdict = json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))
          receipt = {}
          path = Path("evidence/engineering-workflow-receipt.json")
          if path.exists():
              receipt = json.load(open(path, encoding="utf-8"))
          print("## LeQutis PR gate")
          print()
          print(verdict["evidence_label"])
          print()
          print("- merge_allowed:", verdict["merge_allowed"])
          print("- blocking:", ", ".join(verdict["blocking"]) or "none")
          print("- ai_review:", verdict["ai_review"], f"(source={verdict.get('review_source')})")
          print("- tests_passed:", verdict["tests_passed"], f"(attempts={verdict['test_attempts']})")
          print("- required_checks_passed:", verdict.get("required_checks_passed"))
          print("- live_hermes: false / live_hostinger: false / live_telegram: false")
          if receipt:
              payload = receipt.get("payload", {})
              print("- correlation_id:", payload.get("correlation_id"))
              print("- task_id:", payload.get("task_id"))
          print()
          print("<details><summary>gate receipt</summary>")
          print()
          print("```json")
          print(json.dumps(verdict, indent=2, sort_keys=True))
          print("```")
          print("</details>")
          if receipt:
              print()
              print("<details><summary>engineering workflow receipt</summary>")
              print()
              print("```json")
              print(json.dumps(receipt, indent=2, sort_keys=True))
              print("```")
              print("</details>")
          PY
          existing=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq '.[] | select(.user.login=="github-actions[bot]" and ((.body|startswith("## LeQutis PR gate")) or (.body|startswith("LeQutis PR gate")))) | .id')
          for id in $existing; do
            gh api -X DELETE "repos/${REPO}/issues/comments/${id}" >/dev/null || true
          done
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/pr-gate-comment.md

      - name: Merge only a qualifying harmless change
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash
          sha=$(gh api "repos/${REPO}/pulls/${PR}" --jq '.merge_commit_sha // empty')
          echo "merge_sha=$sha"
          if [ -n "$sha" ] && [ -f evidence/engineering-workflow-receipt.json ]; then
            python3 - <<PY
          import json
          path = "evidence/engineering-workflow-receipt.json"
          data = json.load(open(path, encoding="utf-8"))
          data.setdefault("result", {})["merge_sha"] = "$sha"
          data["result"]["merged"] = True
          open(path, "w", encoding="utf-8").write(json.dumps(data, indent=2, sort_keys=True) + "\n")
          print(json.dumps({"merged": True, "merge_sha": "$sha"}, indent=2))
          PY
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-gate-${{ github.event.pull_request.head.sha }}
          path: |
            evidence/pr-gate-receipt.json
            evidence/pr-auditor-receipt.json
            evidence/engineering-workflow-receipt.json
          if-no-files-found: warn
