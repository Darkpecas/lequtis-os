name: LeQutis PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: lequtis-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LEQUTIS_WORKER: deterministic
      LEQUTIS_HERMES_QUERY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests with one bounded retry
        id: tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          code=$?
          attempts=1
          if [ "$code" -ne 0 ]; then
            echo "first test attempt failed; retrying once"
            python3 -m unittest discover -s tests -p 'test_*.py' -q
            code=$?
            attempts=2
          fi
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Independent static auditor
        id: static
        if: always()
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          mkdir -p evidence
          python3 - <<'PY' > /tmp/pr-files.json
          import json, subprocess
          base = "origin/${{ github.base_ref }}"
          proc = subprocess.run(
              ["git", "diff", "--no-renames", "--name-status", f"{base}...HEAD"],
              check=True, text=True, capture_output=True,
          )
          paths = []
          seen = set()
          for line in proc.stdout.splitlines():
              for path in line.split("\t")[1:]:
                  if path and path not in seen:
                      seen.add(path)
                      paths.append(path)
          print(json.dumps(paths))
          PY
          git diff --no-renames "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          python3 integrations/pr_static_auditor.py \
            --files-json "$(cat /tmp/pr-files.json)" \
            --diff-file /tmp/pr.diff \
            --body-file /tmp/pr-body.md \
            --title "$PR_TITLE" \
            --out evidence/pr-static-audit.json
          status=$(python3 -c 'import json; print(json.load(open("evidence/pr-static-audit.json", encoding="utf-8"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait for the independent Codex review
        id: review
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          status=missing
          for _ in 1 2 3 4 5 6 7 8; do
            # Only accept review state for the current PR head SHA.
            summary=$(gh api "repos/${REPO}/issues/${PR}/comments" --jq \
              --arg sha "$HEAD_SHA" \
              '[.[] | select(.user.login=="chatgpt-codex-connector[bot]") | select(.body|contains($sha)) | .body] | join("\n")')
            findings=$(gh api "repos/${REPO}/pulls/${PR}/comments" --jq \
              --arg sha "$HEAD_SHA" \
              '[.[] | select(.user.login=="chatgpt-codex-connector[bot]") | select(.original_commit_id==$sha or .commit_id==$sha) | .body] | join("\n")')
            reviews=$(gh api "repos/${REPO}/pulls/${PR}/reviews" --jq \
              --arg sha "$HEAD_SHA" \
              '[.[] | select(.user.login=="chatgpt-codex-connector[bot]") | select(.commit_id==$sha)] | length')
            all_text=$(printf '%s\n%s' "$summary" "$findings")
            if printf '%s' "$all_text" | grep -q 'codex-code-review-finding'; then
              status=findings
              break
            fi
            if printf '%s' "$summary" | grep -q 'codex-review-state:v1' \
              && printf '%s' "$summary" | grep -q "\"commit_sha\":\"${HEAD_SHA}\"" \
              && printf '%s' "$summary" | grep -q '"status":"completed"'; then
              if printf '%s' "$summary" | grep -q '"has_any_findings":true'; then
                status=findings
              else
                status=pass
              fi
              break
            fi
            if [ "$reviews" != "0" ] && ! printf '%s' "$all_text" | grep -q 'codex-code-review-finding'; then
              status=pass
              break
            fi
            sleep 30
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Decide
        id: decide
        if: always()
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          mkdir -p evidence
          python3 integrations/pr_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --body-file /tmp/pr-body.md \
            --tests-passed "${{ steps.tests.outputs.passed }}" \
            --ai-review "${{ steps.review.outputs.status }}" \
            --static-audit "${{ steps.static.outputs.status }}" \
            --test-attempts "${{ steps.tests.outputs.attempts }}" \
            --out evidence/pr-gate-receipt.json
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          merge=$(python3 -c 'import json; print("true" if json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))["merge_allowed"] else "false")')
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record engineering workflow receipt
        if: always()
        shell: bash
        run: |
          python3 integrations/engineering_workflow.py \
            --task-id "pr-${{ github.event.pull_request.number }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.base_ref }}" \
            --gate-file evidence/pr-gate-receipt.json \
            --static-audit-file evidence/pr-static-audit.json \
            --ai-review "${{ steps.review.outputs.status }}" \
            --tests-passed "${{ steps.tests.outputs.passed }}" \
            --test-attempts "${{ steps.tests.outputs.attempts }}" \
            --merge-attempted "${{ steps.decide.outputs.merge }}" \
            --merge-result "$([ "${{ steps.decide.outputs.merge }}" = "true" ] && echo queued || echo refused)" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out evidence/engineering-workflow-receipt.json
      - name: Post the receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY' > /tmp/pr-gate-comment.md
          import json
          from pathlib import Path
          verdict = json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))
          static = json.load(open("evidence/pr-static-audit.json", encoding="utf-8"))
          workflow = json.load(open("evidence/engineering-workflow-receipt.json", encoding="utf-8"))
          print("LeQutis PR gate")
          print()
          print(verdict["evidence_label"])
          print()
          print("authority: LeQutis (GitHub/Codex/Hermes/Telegram are subordinate)")
          print("merge_allowed:", verdict["merge_allowed"])
          print("blocking:", ", ".join(verdict["blocking"]) or "none")
          print("ai_review:", verdict["ai_review"])
          print("static_audit:", verdict.get("static_audit"), f"({len(static.get('findings') or [])} findings)")
          print("tests_passed:", verdict["tests_passed"])
          print("test_attempts:", verdict["test_attempts"])
          print("correlation_id:", workflow.get("correlation_id"))
          print("live_hermes: false")
          print("live_hostinger: false")
          print("live_telegram: false")
          print()
          print("```json")
          print(json.dumps({"gate": verdict, "static_audit": static, "workflow": workflow}, indent=2, sort_keys=True))
          print("```")
          PY
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/pr-gate-comment.md
      - name: Merge only a qualifying harmless change
        id: merge
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          echo "result=merged" >> "$GITHUB_OUTPUT"
      - name: Update workflow receipt after merge attempt
        if: always() && steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          python3 integrations/engineering_workflow.py \
            --task-id "pr-${{ github.event.pull_request.number }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.base_ref }}" \
            --gate-file evidence/pr-gate-receipt.json \
            --static-audit-file evidence/pr-static-audit.json \
            --ai-review "${{ steps.review.outputs.status }}" \
            --tests-passed "${{ steps.tests.outputs.passed }}" \
            --test-attempts "${{ steps.tests.outputs.attempts }}" \
            --merge-attempted true \
            --merge-result "${{ steps.merge.outputs.result || 'failed' }}" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out evidence/engineering-workflow-receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-gate-${{ github.sha }}
          path: |
            evidence/pr-gate-receipt.json
            evidence/pr-static-audit.json
            evidence/engineering-workflow-receipt.json
          if-no-files-found: warn
