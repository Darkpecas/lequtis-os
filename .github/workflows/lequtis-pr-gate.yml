name: LeQutis PR gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: lequtis-pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: write
  pull-requests: write
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      LEQUTIS_WORKER: deterministic
      LEQUTIS_HERMES_QUERY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests with one bounded retry
        id: tests
        shell: bash
        run: |
          set +e
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          code=$?
          attempts=1
          if [ "$code" -ne 0 ]; then
            echo "first test attempt failed; retrying once"
            python3 -m unittest discover -s tests -p 'test_*.py' -q
            code=$?
            attempts=2
          fi
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "passed=$([ "$code" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Independent static auditor
        id: static
        if: always()
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          mkdir -p evidence
          python3 - <<'PY' > /tmp/pr-files.json
          import json, subprocess
          base = "origin/${{ github.base_ref }}"
          proc = subprocess.run(
              ["git", "diff", "--no-renames", "--name-status", f"{base}...HEAD"],
              check=True, text=True, capture_output=True,
          )
          paths = []
          seen = set()
          for line in proc.stdout.splitlines():
              for path in line.split("\t")[1:]:
                  if path and path not in seen:
                      seen.add(path)
                      paths.append(path)
          print(json.dumps(paths))
          PY
          git diff --no-renames "origin/${{ github.base_ref }}...HEAD" > /tmp/pr.diff
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          python3 integrations/pr_static_auditor.py \
            --files-json "$(cat /tmp/pr-files.json)" \
            --diff-file /tmp/pr.diff \
            --body-file /tmp/pr-body.md \
            --title "$PR_TITLE" \
            --out evidence/pr-static-audit.json
          status=$(python3 -c 'import json; print(json.load(open("evidence/pr-static-audit.json", encoding="utf-8"))["status"])')
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Wait for the independent Codex review
        id: review
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          status=missing
          for _ in 1 2 3 4 5 6 7 8; do
            status=$(python3 integrations/codex_review_status.py \
              --repo "$REPO" --pr "$PR" --head-sha "$HEAD_SHA" | tr -d '\r')
            if [ "$status" = "pass" ] || [ "$status" = "findings" ]; then
              break
            fi
            sleep 30
          done
          echo "status=${status:-missing}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Decide
        id: decide
        if: always()
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          git fetch origin "${{ github.base_ref }}"
          printf '%s' "$PR_BODY" > /tmp/pr-body.md
          mkdir -p evidence
          AI_REVIEW="${{ steps.review.outputs.status }}"
          STATIC="${{ steps.static.outputs.status }}"
          TESTS="${{ steps.tests.outputs.passed }}"
          ATTEMPTS="${{ steps.tests.outputs.attempts }}"
          python3 integrations/pr_gate.py \
            --base "origin/${{ github.base_ref }}" \
            --head HEAD \
            --body-file /tmp/pr-body.md \
            --tests-passed "${TESTS:-false}" \
            --ai-review "${AI_REVIEW:-missing}" \
            --static-audit "${STATIC:-findings}" \
            --test-attempts "${ATTEMPTS:-1}" \
            --out evidence/pr-gate-receipt.json
          code=$?
          echo "exit=$code" >> "$GITHUB_OUTPUT"
          if [ -f evidence/pr-gate-receipt.json ]; then
            merge=$(python3 -c 'import json; print("true" if json.load(open("evidence/pr-gate-receipt.json", encoding="utf-8"))["merge_allowed"] else "false")')
          else
            merge=false
          fi
          echo "merge=$merge" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Record engineering workflow receipt
        if: always()
        shell: bash
        run: |
          set +e
          MERGE="${{ steps.decide.outputs.merge }}"
          AI_REVIEW="${{ steps.review.outputs.status }}"
          TESTS="${{ steps.tests.outputs.passed }}"
          ATTEMPTS="${{ steps.tests.outputs.attempts }}"
          mkdir -p evidence
          GATE_ARGS=()
          STATIC_ARGS=()
          if [ -f evidence/pr-gate-receipt.json ]; then
            GATE_ARGS=(--gate-file evidence/pr-gate-receipt.json)
          fi
          if [ -f evidence/pr-static-audit.json ]; then
            STATIC_ARGS=(--static-audit-file evidence/pr-static-audit.json)
          fi
          python3 integrations/engineering_workflow.py \
            --task-id "pr-${{ github.event.pull_request.number }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.base_ref }}" \
            "${GATE_ARGS[@]}" \
            "${STATIC_ARGS[@]}" \
            --ai-review "${AI_REVIEW:-missing}" \
            --tests-passed "${TESTS:-false}" \
            --test-attempts "${ATTEMPTS:-1}" \
            --merge-attempted "${MERGE:-false}" \
            --merge-result "$([ "${MERGE:-false}" = "true" ] && echo queued || echo refused)" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out evidence/engineering-workflow-receipt.json
          exit 0
      - name: Post the receipt
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          python3 - <<'PY' > /tmp/pr-gate-comment.md
          import json
          from pathlib import Path

          def load(path):
              p = Path(path)
              if not p.is_file():
                  return {"missing": True, "path": path}
              return json.loads(p.read_text(encoding="utf-8"))

          verdict = load("evidence/pr-gate-receipt.json")
          static = load("evidence/pr-static-audit.json")
          workflow = load("evidence/engineering-workflow-receipt.json")
          print("LeQutis PR gate")
          print()
          print(verdict.get("evidence_label", "LOCAL PROOF, NOT LIVE VPS VERIFIED"))
          print()
          print("authority: LeQutis (GitHub/Codex/Hermes/Telegram are subordinate)")
          print("merge_allowed:", verdict.get("merge_allowed"))
          print("blocking:", ", ".join(verdict.get("blocking") or []) or "none")
          print("ai_review:", verdict.get("ai_review"))
          print(
              "static_audit:",
              verdict.get("static_audit"),
              f"({len(static.get('findings') or [])} findings)",
          )
          print("tests_passed:", verdict.get("tests_passed"))
          print("test_attempts:", verdict.get("test_attempts"))
          print("correlation_id:", workflow.get("correlation_id"))
          print("live_hermes: false")
          print("live_hostinger: false")
          print("live_telegram: false")
          print()
          print("```json")
          print(json.dumps({"gate": verdict, "static_audit": static, "workflow": workflow}, indent=2, sort_keys=True))
          print("```")
          PY
          gh pr comment "$PR" --repo "$REPO" --body-file /tmp/pr-gate-comment.md
          exit 0
      - name: Merge only a qualifying harmless change
        id: merge
        if: steps.decide.outputs.merge == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          gh pr merge "$PR" --repo "$REPO" --squash --match-head-commit "$HEAD_SHA"
          echo "result=merged" >> "$GITHUB_OUTPUT"
      - name: Update workflow receipt after merge attempt
        if: always() && steps.decide.outputs.merge == 'true'
        shell: bash
        run: |
          set +e
          AI_REVIEW="${{ steps.review.outputs.status }}"
          TESTS="${{ steps.tests.outputs.passed }}"
          ATTEMPTS="${{ steps.tests.outputs.attempts }}"
          python3 integrations/engineering_workflow.py \
            --task-id "pr-${{ github.event.pull_request.number }}" \
            --pr-number "${{ github.event.pull_request.number }}" \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --head-sha "${{ github.event.pull_request.head.sha }}" \
            --base-ref "${{ github.base_ref }}" \
            --gate-file evidence/pr-gate-receipt.json \
            --static-audit-file evidence/pr-static-audit.json \
            --ai-review "${AI_REVIEW:-missing}" \
            --tests-passed "${TESTS:-false}" \
            --test-attempts "${ATTEMPTS:-1}" \
            --merge-attempted true \
            --merge-result "${{ steps.merge.outputs.result || 'failed' }}" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --out evidence/engineering-workflow-receipt.json
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr-gate-${{ github.sha }}
          path: |
            evidence/pr-gate-receipt.json
            evidence/pr-static-audit.json
            evidence/engineering-workflow-receipt.json
          if-no-files-found: warn
