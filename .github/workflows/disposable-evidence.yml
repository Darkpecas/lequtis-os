name: LeQutis disposable evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEQUTIS_HERMES_QUERY: ""
      LEQUTIS_WORKER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Disposable evidence suite
        run: bash tests/run_disposable_evidence.sh
