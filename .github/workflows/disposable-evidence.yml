name: LeQutis disposable evidence
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LEQUTIS_HERMES_QUERY: ""
      LEQUTIS_WORKER: deterministic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Kernel v3 replaced run_loop, the skills lifecycle, and worker-driven
      # THINK/CHOOSE. Those scripts still import that surface and are not the
      # gate for this kernel. Disposable proof is the v3 suite plus the
      # adapters that still call into core/lequtis.py.
      - name: Kernel v3 disposable proof
        run: python3 -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py' -v
      - name: Stdio connector fail-closed
        run: python3 tests/test_bridge.py
      - name: Preflight contract
        run: python3 tests/test_host_preflight.py
      - name: Hermes route cannot fake live proof
        run: python3 tests/test_hermes_route.py
      - name: Host read-only receipt fails closed
        run: python3 tests/test_host_receipt.py
      - name: Explicit evidence boundary
        run: |
          echo "CI tests disposable/local behavior only."
          echo "No Hostinger tunnel, canonical production database, or live Hermes claims."
